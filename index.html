<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARPG Mago — Classes, Skills & Auras</title>
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body>
  <div id="app">
    <main id="game">
      <div class="grid"></div><div id="arena"></div><div id="hud"></div><div id="player"></div>
      <div id="combat-log" class="panel-card"></div>
      <div id="help" class="panel-card">WASD mover · Espaço ataque básico · 1/2 skills · 3 Aura · Shift dash · skills seguem o cursor</div>
    </main>
    <aside id="sidebar">
      <nav id="tabs" class="tabs">
        <button class="tab active" data-tab="classes">👑 Classes</button>
        <button class="tab" data-tab="talents">🌳 Mago</button>
        <button class="tab" data-tab="skills">✨ Loadout</button>
      </nav>
      <section id="panel-classes" class="content-panel"></section>
      <section id="panel-talents" class="content-panel hidden"></section>
      <section id="panel-skills" class="content-panel hidden"></section>
    </aside>
  </div>
  <script>window.addEventListener('error',function(e){var box=document.getElementById('boot-error');if(box){box.hidden=false;box.innerHTML='<b>Erro ao iniciar o protótipo.</b><br><small>'+String(e.error?.message||e.message||'Erro de JavaScript')+'</small><br><button onclick="localStorage.clear();location.reload()">Limpar save e reiniciar</button>'}});window.addEventListener('unhandledrejection',function(e){var box=document.getElementById('boot-error');if(box){box.hidden=false;box.innerHTML='<b>Erro ao iniciar o protótipo.</b><br><small>'+String(e.reason?.message||e.reason||'Promise rejeitada')+'</small><br><button onclick="localStorage.clear();location.reload()">Limpar save e reiniciar</button>'}});</script>
  <div id="boot-error" hidden style="position:fixed;left:20px;right:20px;top:20px;z-index:99999;padding:16px;background:#3a1118;color:#fff;border:1px solid #ff7085;border-radius:12px;font:14px system-ui;box-shadow:0 12px 40px #0008"></div>
  <script type="module" src="./src/js/main.js?v=11"></script>
</body>
</html>
